name: Déployer sur GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: mkdir _site && cp -r index.html app.js crypto.js media.js sync.js sw.js styles.css manifest.webmanifest icons _site/ && touch _site/.nojekyll
          sed -i "s/__VERSION__/1.${{ github.run_number }} (${GITHUB_SHA::7})/" _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
